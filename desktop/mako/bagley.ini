# Bagley's notifications in ctOS colours (replies from `bagley see` and `bagley explain`,
# reminders, approvals). Append this to ~/.config/mako/config, after the global options (mako
# reads criteria sections last), then run `makoctl reload`.
#
# Approvals arrive as critical notifications with Allow and Deny actions: middle-click one to
# pick an action in rofi, or answer it in the overlay or with `bagley approve`.

[app-name=Bagley]
font=JetBrains Mono 11
background-color=#0E0E0Eee
text-color=#CACACA
border-color=#D9D9D9
border-size=1
border-radius=0
padding=12
progress-color=over #202020
# Model text is shown as written, never parsed as Pango markup.
markup=0
actions=1
on-button-left=invoke-default-action
on-button-middle=exec makoctl menu -n "$id" rofi -dmenu -p BAGLEY
on-button-right=dismiss

[app-name=Bagley urgency=low]
border-color=#202020

[app-name=Bagley urgency=critical]
border-color=#FC3E38
default-timeout=0
