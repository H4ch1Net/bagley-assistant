# Bagley on Hyprland (hyprlang config, hyprland.conf).
#
# Copy to ~/.config/hypr/bagley.conf and add this line to ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/bagley.conf
#
# The binds talk to the Quickshell instance that loads BagleyOverlay. `qs ipc` has to name that
# instance the way it was started: the ctOS bar runs as `qs --path /opt/ctos/bar.qml`. Change
# $bagley if your bar lives in ~/ctOS or if you run the overlay on its own
# (desktop/quickshell/bagley/shell.qml).

$bagley = qs ipc -p /opt/ctos/bar.qml call bagley
# $bagley = qs ipc -p ~/ctOS/bar.qml call bagley
# $bagley = qs ipc -p ~/.config/quickshell/bagley/shell.qml call bagley

# SUPER+B: ask Bagley (opens or closes the overlay).
bind = SUPER, B, exec, $bagley toggle

# SUPER+SHIFT+B: "what's on my screen?" A screenshot of the focused window with its title, the
# highlighted text and the clipboard go to a vision model; the answer streams into the overlay.
bind = SUPER SHIFT, B, exec, $bagley see

# SUPER+ALT+B: explain the highlighted text (or the clipboard).
bind = SUPER ALT, B, exec, $bagley explain

# Without Quickshell, the same two answer as mako notifications instead:
# bind = SUPER SHIFT, B, exec, bagley see
# bind = SUPER ALT, B, exec, bagley explain

# No window rule is needed: the overlay is a layer surface (namespace "bagley"), not a window.
# Optional blur behind the panel and no compositor animation (the overlay fades itself). This is
# the rule syntax before Hyprland 0.53; newer releases use the Lua file (hl.layer_rule).
# layerrule = blur, ^(bagley)$
# layerrule = ignorealpha 0.5, ^(bagley)$
# layerrule = noanim, ^(bagley)$
