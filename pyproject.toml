[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bagley-assistant"
dynamic = ["version"]
description = "A local-first AI assistant with an animated avatar, tool use and a web UI. Runs on Ollama or any OpenAI-compatible server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "H4ch1" }]
requires-python = ">=3.10"
keywords = ["assistant", "llm", "ollama", "agent", "local-ai", "tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "httpx>=0.27",
  "anthropic>=1.9,<2",
  "psutil>=5.9",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
screenshots = ["playwright>=1.45"]
pdf = ["pypdf>=4"]

[project.scripts]
bagley = "bagley.cli:main"

[project.urls]
Homepage = "https://github.com/H4ch1Net/bagley-assistant"
Issues = "https://github.com/H4ch1Net/bagley-assistant/issues"

[tool.hatch.version]
path = "bagley/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["bagley"]

# The Quickshell overlay, Hyprland binds, mako style, zsh plugin and systemd units, for
# `bagley desktop install` from a wheel.
[tool.hatch.build.targets.wheel.force-include]
"desktop" = "bagley/desktop/files"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ui: browser tests (need Playwright and Chromium)"]
filterwarnings = ["error::RuntimeWarning"]
