<!doctype html>
<html lang="en" data-theme="ctos">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ctOS Lockup</title><link rel="stylesheet" href="../tokens.css"></head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;300;400;500;600;700&display=swap">
<style>*{box-sizing:border-box}html,body{margin:0;background:var(--background);color:var(--textPrimary);font-family:var(--font-mono)}
body{padding:16px}
.cf{position:relative}.cf>i{position:absolute;width:7px;height:7px;border:0 solid var(--textPrimary)}
.cf>i:nth-child(1){left:0;top:0;border-top-width:1px;border-left-width:1px}.cf>i:nth-child(2){right:0;top:0;border-top-width:1px;border-right-width:1px}
.cf>i:nth-child(3){right:0;bottom:0;border-bottom-width:1px;border-right-width:1px}.cf>i:nth-child(4){left:0;bottom:0;border-bottom-width:1px;border-left-width:1px}
.acc{position:absolute;width:4px;height:4px}
.cap{font-size:12px;color:var(--textSecondary);letter-spacing:.04em}

.wrap{display:flex;gap:56px;align-items:center;flex-wrap:wrap;padding:24px}
.lk{position:relative}.lk .bar{position:absolute;left:0;top:0;bottom:0;background:var(--ctosGray)}
.lk .ct{position:absolute;color:var(--background);font-weight:500;line-height:1}
.lk .os{position:absolute;right:0;color:var(--textPrimary);font-weight:300;line-height:1;text-align:right}
.sys{display:flex;align-items:center}.blk{position:relative;width:105px;height:37px;background:var(--ctosGray)}
.blk img{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:29.6px}.blk span{position:absolute;right:2px;bottom:3px;font-size:22px;font-weight:500;color:var(--background);line-height:1}
.sys .o{font-size:36px;font-weight:300;color:var(--ctosGray);margin-left:2px;line-height:1}
</style>
<div class="wrap"><div class="lk" style="width:441.0px;height:72.0px">
<div class="bar" style="width:321.93px"></div>
<span class="ct" style="left:255.77999999999997px;font-size:51.0px;bottom:7.5px">CT</span>
<span class="os" style="width:114.66000000000001px;font-size:96.0px;bottom:-4.5px">OS</span>
<img class="acc" src="../assets/accent.svg" alt="" style="top:-14px;left:-22px;width:4px;height:4px;transform:rotate(0deg)"><img class="acc" src="../assets/accent.svg" alt="" style="top:-14px;left:459.0px;width:4px;height:4px;transform:rotate(90deg)"><img class="acc" src="../assets/accent.svg" alt="" style="top:82.0px;left:459.0px;width:4px;height:4px;transform:rotate(180deg)"><img class="acc" src="../assets/accent.svg" alt="" style="top:82.0px;left:-22px;width:4px;height:4px;transform:rotate(270deg)"></div>
<div class="sys"><div class="blk"><img src="../assets/distro-arch.svg" alt=""><span>CT</span></div><span class="o">OS</span></div>
</div>
</body>
</html>
