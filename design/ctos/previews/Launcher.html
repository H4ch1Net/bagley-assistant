<!doctype html>
<html lang="en" data-theme="ctos">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ctOS Launcher</title><link rel="stylesheet" href="../tokens.css"></head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;300;400;500;600;700&display=swap">
<style>*{box-sizing:border-box}html,body{margin:0;background:var(--background);color:var(--textPrimary);font-family:var(--font-mono)}body{padding:16px}.cap{font-size:12px;color:var(--textSecondary)}

.win{width:560px;max-width:100%;background:var(--panel-translucent);border:1px solid var(--ctosGray);font-size:16px}
.mb{padding:14px;display:flex;flex-direction:column;gap:12px}
.ib{display:flex;gap:10px;padding:8px 10px;border-bottom:1px solid var(--textSecondary)}
.pr{color:var(--success)}.ph{color:var(--textSecondary)}
.lv{display:flex;flex-direction:column;gap:2px}
.el{display:flex;gap:12px;align-items:center;padding:8px 10px;border-left:2px solid transparent;color:var(--textPrimaryDim)}
.el.sel{background:var(--backgroundBright);border-left-color:var(--ctosGray);color:#fff}
.ic{width:26px;height:26px;border:1px solid var(--textSecondary);position:relative;flex:none}
.ic:before{content:"";position:absolute;inset:6px;border:2px solid var(--ctosGray)}
</style>
<div class="win"><div class="mb"><div class="ib"><span class="pr">ctOS</span><span class="ph">SEARCH</span></div><div class="lv"><div class="el sel"><span class="ic"></span><span>Files</span></div><div class="el"><span class="ic"></span><span>Editor</span></div><div class="el"><span class="ic"></span><span>System Monitor</span></div><div class="el"><span class="ic"></span><span>Audio</span></div><div class="el"><span class="ic"></span><span>Spotify</span></div><div class="el"><span class="ic"></span><span>Network</span></div></div></div></div>
<p class="cap">Icons here are stand-ins for the 26px ctos-*.svg app icons in the App icons asset group.</p>

</body>
</html>
