<!doctype html>
<html lang="en" data-theme="ctos">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ctOS Bar</title><link rel="stylesheet" href="../tokens.css"></head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;300;400;500;600;700&display=swap">
<style>*{box-sizing:border-box}html,body{margin:0;background:var(--background);color:var(--textPrimary);font-family:var(--font-mono)}
body{padding:16px}
.cf{position:relative}.cf>i{position:absolute;width:7px;height:7px;border:0 solid var(--textPrimary)}
.cf>i:nth-child(1){left:0;top:0;border-top-width:1px;border-left-width:1px}.cf>i:nth-child(2){right:0;top:0;border-top-width:1px;border-right-width:1px}
.cf>i:nth-child(3){right:0;bottom:0;border-bottom-width:1px;border-right-width:1px}.cf>i:nth-child(4){left:0;bottom:0;border-bottom-width:1px;border-left-width:1px}
.acc{position:absolute;width:4px;height:4px}
.cap{font-size:12px;color:var(--textSecondary);letter-spacing:.04em}

.bar{position:relative;display:flex;height:37px;background:var(--background);width:1460px}
.bar:after{content:"";position:absolute;inset:0;border:1px solid var(--ctosGray);pointer-events:none}
.sys{position:relative;width:105px;height:37px;background:var(--ctosGray);flex:none}
.sys img{position:absolute;left:8px;top:50%;width:29.6px;height:29.6px;transform:translateY(-50%)}
.sys .ct{position:absolute;right:2px;bottom:3px;font-size:22px;font-weight:500;color:var(--background);line-height:1}
.os{font-size:36px;font-weight:300;color:var(--ctosGray);padding-right:2px;align-self:center;line-height:1;margin-left:2px}
.div{width:1px;background:var(--textSecondary);margin:1px 0;flex:none}
.ws{width:37px;height:37px;display:grid;place-items:center;flex:none;cursor:pointer}
.wsf{width:31px;height:31px}.wsf b,.wsf u{position:absolute;background:var(--ctosGray);opacity:0;left:50%;top:50%;transform:translate(-50%,-50%)}
.wsf b{width:9px;height:1px}.wsf u{width:1px;height:9px}.ws.on b,.ws.on u{opacity:1}.ws.hov b,.ws.hov u{opacity:.35}
.seg{height:37px;display:grid;place-items:center;flex:none}.frame{height:31px}
.in{position:absolute;left:11px;top:5px;right:11px;display:flex;align-items:center;gap:5px;height:21px;font-size:16px;font-weight:500;white-space:nowrap}
.meter{width:90px;display:flex;flex-direction:column;gap:1px;margin-top:-2px}
.mr{display:flex;gap:2px;font-size:12px;font-weight:600;color:#fff}.mr .fill{flex:1}
.track{height:3px;background:var(--textSecondary)}.track div{height:3px;background:var(--ctosGray)}
.dotw{position:relative;width:19px;height:19px;display:grid;place-items:center}.dot{width:7.6px;height:7.6px;border-radius:50%;background:var(--success)}
.g{color:var(--textSecondary)}.wht{color:var(--textPrimary)}.sp{flex:1}
</style>
<div class="bar">
 <div class="sys"><img src="../assets/distro-arch.svg" alt=""><span class="ct">CT</span></div><span class="os">OS</span>
 <div class="div"></div><div class="ws"><div class="cf wsf"><i></i><i></i><i></i><i></i><b></b><u></u></div></div><div class="div"></div><div class="ws on"><div class="cf wsf"><i></i><i></i><i></i><i></i><b></b><u></u></div></div><div class="div"></div><div class="ws"><div class="cf wsf"><i></i><i></i><i></i><i></i><b></b><u></u></div></div><div class="div"></div><div class="ws hov"><div class="cf wsf"><i></i><i></i><i></i><i></i><b></b><u></u></div></div><div class="div"></div><div class="ws"><div class="cf wsf"><i></i><i></i><i></i><i></i><b></b><u></u></div></div><div class="div"></div><div class="seg" style="width:118px"><div class="cf frame" style="width:112px"><i></i><i></i><i></i><i></i><div class="in"><div class="meter"><div class="mr"><span>CPU</span><span>&lt;&gt;</span><span class="fill"></span><span>012%</span></div><div class="track"><div style="width:12%"></div></div></div></div></div></div><div class="div"></div><div class="seg" style="width:118px"><div class="cf frame" style="width:112px"><i></i><i></i><i></i><i></i><div class="in"><div class="meter"><div class="mr"><span>MEM</span><span>##</span><span class="fill"></span><span>3.4G</span></div><div class="track"><div style="width:22%"></div></div></div></div></div></div><div class="div"></div>
 <div class="sp"></div><div class="seg" style="width:128px"><div class="cf frame" style="width:122px"><i></i><i></i><i></i><i></i><div class="in"><span class="dotw"><span class="dot"></span></span><span>HOMENET</span></div></div></div><div class="div"></div><div class="seg" style="width:106px"><div class="cf frame" style="width:100px"><i></i><i></i><i></i><i></i><div class="in"><span style="font-size:18px;font-weight:600">▨</span><span>H4CH1</span></div></div></div><div class="div"></div><div class="seg" style="width:96px"><div class="cf frame" style="width:90px"><i></i><i></i><i></i><i></i><div class="in"><span class="g">BAT=</span><span>100</span></div></div></div><div class="div"></div><div class="seg" style="width:358px"><div class="cf frame" style="width:352px"><i></i><i></i><i></i><i></i><div class="in"><span class="g">071026</span><span class="wht" style="margin-left:-5px">-1643-</span><span class="g" style="margin-left:-5px">PDT-B1T-MIC045VOL060</span></div></div></div>
</div>
<p class="cap">Workspace 2 active (crosshair), workspace 4 hovered (crosshair at 0.35). Click a square to switch.</p>

</body>
</html>
