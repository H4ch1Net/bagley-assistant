<!doctype html>
<html lang="en" data-theme="ctos">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ctOS CornerFrame</title><link rel="stylesheet" href="../tokens.css"></head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;300;400;500;600;700&display=swap">
<style>*{box-sizing:border-box}html,body{margin:0;background:var(--background);color:var(--textPrimary);font-family:var(--font-mono)}
body{padding:16px}
.cf{position:relative}.cf>i{position:absolute;width:7px;height:7px;border:0 solid var(--textPrimary)}
.cf>i:nth-child(1){left:0;top:0;border-top-width:1px;border-left-width:1px}.cf>i:nth-child(2){right:0;top:0;border-top-width:1px;border-right-width:1px}
.cf>i:nth-child(3){right:0;bottom:0;border-bottom-width:1px;border-right-width:1px}.cf>i:nth-child(4){left:0;bottom:0;border-bottom-width:1px;border-left-width:1px}
.acc{position:absolute;width:4px;height:4px}
.cap{font-size:12px;color:var(--textSecondary);letter-spacing:.04em}

.row{display:flex;gap:32px;align-items:center;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.f1{width:112px;height:31px}.f1 .in{position:absolute;left:11px;top:5px;font-size:12px;font-weight:600;display:flex;flex-direction:column;gap:1px;width:90px}
.mr{display:flex;gap:2px}.mr .fill{flex:1}.track{height:3px;background:var(--textSecondary)}.track div{height:3px;width:63%;background:var(--ctosGray)}
.f2{width:120px;height:31px}.f2 .in{position:absolute;left:11px;top:5px;font-size:16px;font-weight:500}
.ab{position:relative;width:160px;height:40px;margin:16px 26px;border:1px solid var(--textSecondary);display:grid;place-items:center;font-size:12px;color:var(--textPrimaryDimmer)}
</style>
<div class="row">
<div class="cell"><div class="cf f1"><i></i><i></i><i></i><i></i><div class="in"><div class="mr"><span>MEM</span><span>##</span><span class="fill"></span><span>9.8G</span></div><div class="track"><div></div></div></div></div><span class="cap">meter, 90px content</span></div>
<div class="cell"><div class="cf f2"><i></i><i></i><i></i><i></i><div class="in" style="color:var(--textSecondary)">BAT-<span style="color:var(--error)">015</span></div></div><span class="cap">low battery, red value</span></div>
<div class="cell"><div class="cf f2"><i></i><i></i><i></i><i></i><div class="in" style="color:var(--textSecondary)">BAT+<span style="color:var(--success)">087</span></div></div><span class="cap">charging, green value</span></div>
<div class="cell"><div class="ab"><img class="acc"  src="../assets/accent.svg" alt="" style="top:-15px;left:-23px;width:4px;height:4px;transform:rotate(0deg)"><img class="acc"  src="../assets/accent.svg" alt="" style="top:-15px;left:177px;width:4px;height:4px;transform:rotate(90deg)"><img class="acc"  src="../assets/accent.svg" alt="" style="top:49px;left:177px;width:4px;height:4px;transform:rotate(180deg)"><img class="acc"  src="../assets/accent.svg" alt="" style="top:49px;left:-23px;width:4px;height:4px;transform:rotate(270deg)">version box</div><span class="cap">Accents: 4px quarter discs, 18px and 10px out</span></div>
</div>

</body>
</html>
