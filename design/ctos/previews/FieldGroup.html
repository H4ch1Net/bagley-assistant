<!doctype html>
<html lang="en" data-theme="ctos">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ctOS FieldGroup</title><link rel="stylesheet" href="../tokens.css"></head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;300;400;500;600;700&display=swap">
<style>*{box-sizing:border-box}html,body{margin:0;background:var(--background);color:var(--textPrimary);font-family:var(--font-mono)}
body{padding:16px}
.cf{position:relative}.cf>i{position:absolute;width:7px;height:7px;border:0 solid var(--textPrimary)}
.cf>i:nth-child(1){left:0;top:0;border-top-width:1px;border-left-width:1px}.cf>i:nth-child(2){right:0;top:0;border-top-width:1px;border-right-width:1px}
.cf>i:nth-child(3){right:0;bottom:0;border-bottom-width:1px;border-right-width:1px}.cf>i:nth-child(4){left:0;bottom:0;border-bottom-width:1px;border-left-width:1px}
.acc{position:absolute;width:4px;height:4px}
.cap{font-size:12px;color:var(--textSecondary);letter-spacing:.04em}

.row{display:flex;gap:40px;align-items:flex-start}
.fgw{width:294px;display:flex;flex-direction:column}
.lbl{display:flex;gap:5px;align-items:center;font-size:14px;margin-bottom:2px}.lbl img{height:10px}
.field{height:40px;background:var(--background);border:2px solid var(--ctosGray);padding-left:8px;display:flex;align-items:center;font-size:16px;letter-spacing:5px}
.login{align-self:flex-end;width:38%;height:26px;background:var(--ctosGray);color:var(--background);display:grid;place-items:center;font-size:16px;margin-bottom:8px}
.spin{display:grid;grid-template-columns:repeat(3,5px);gap:3px}.spin i{width:5px;height:5px;background:var(--background)}
.ok{width:294px;display:flex;flex-direction:column}.thin{height:4px;outline:2px solid var(--textSecondary);margin-top:26px;position:relative;background:var(--background)}
.thin div{position:absolute;inset:0;width:40%;background:var(--ctosGray)}
.pl{display:flex;justify-content:space-between;margin-top:5px;font-size:14px}
</style>
<div class="row"><div class="fgw"><div class="lbl"><img src="../assets/barcode.svg" alt=""><span>PASSPHRASE</span></div>
<div class="field"><span style="color:var(--textPrimary)">████████</span><span class="cur" style="color:var(--textPrimary)">▁</span></div>
<div class="login">LOGIN</div><span class="cap">READY</span></div><div class="fgw"><div class="lbl"><img src="../assets/barcode.svg" alt=""><span>PASSPHRASE</span></div>
<div class="field"><span style="color:var(--textPrimaryDim)">████████</span><span class="cur" style="color:var(--textPrimaryDim)">▁</span></div>
<div class="login"><span class="spin"><i style="opacity:.15"></i><i style="opacity:1"></i><i style="opacity:1"></i><i style="opacity:.15"></i><i style="visibility:hidden"></i><i style="opacity:.15"></i><i style="opacity:.15"></i><i style="opacity:.15"></i><i style="opacity:.15"></i></span></div><span class="cap">LOADING</span></div><div class="fgw"><div class="lbl"><img src="../assets/barcode.svg" alt=""><span>PASSPHRASE</span></div>
<div class="field"><span style="color:var(--error)">████</span><span class="cur" style="color:var(--error)">▁</span></div>
<div class="login">LOGIN</div><span class="cap">FAILED</span></div>
<div class="ok"><div class="thin"><div></div></div><div class="pl"><span style="color:var(--textPrimaryDimmer)">INITIALIZING..</span><span style="color:var(--textPrimaryDim);font-weight:500">40</span></div><span class="cap" style="margin-top:28px">SUCCESS: collapsed to 4px, filling</span></div>
</div>
</body>
</html>
